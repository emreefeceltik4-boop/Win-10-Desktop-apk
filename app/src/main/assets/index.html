<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Windows 10 Masaüstü</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050811;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    color: #fff;
  }
  #viewport {
    position: relative;
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #04070f;
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 1920px;
    height: 1350px;
    transform-origin: center center;
    overflow: hidden;
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.75);
  }
  #wallpaper {
    position: absolute;
    inset: 0;
    width: 1920px;
    height: 1350px;
    display: block;
    z-index: 1;
  }
  #desktop-icons {
    position: relative;
    z-index: 5;
    width: 100%;
    height: calc(100% - 68px);
    padding: 24px;
    display: flex;
    flex-direction: column;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 14px;
  }
  .desk-icon {
    width: 118px;
    padding: 10px 8px;
    border-radius: 6px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 8px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.12s ease, border-color 0.12s ease;
  }
  .desk-icon:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.2);
  }
  .desk-icon.selected {
    background: rgba(56, 152, 255, 0.28);
    border-color: rgba(120, 190, 255, 0.65);
  }
  .desk-icon .glyph {
    width: 54px;
    height: 54px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 28px;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    background: linear-gradient(145deg, rgba(255,255,255,0.22), rgba(255,255,255,0.06));
    backdrop-filter: blur(6px);
  }
  .desk-icon .label {
    font-size: 14px;
    line-height: 1.25;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.9);
    word-break: break-word;
  }
  #windows-layer {
    position: absolute;
    inset: 0;
    z-index: 15;
    pointer-events: none;
  }
  .win {
    position: absolute;
    pointer-events: auto;
    min-width: 480px;
    min-height: 320px;
    background: rgba(22, 26, 36, 0.94);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 10px;
    box-shadow: 0 24px 64px rgba(0, 0, 0, 0.65);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .win-header {
    height: 44px;
    background: rgba(14, 17, 24, 0.95);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px 0 16px;
    cursor: grab;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .win-title {
    font-size: 14px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .win-controls {
    display: flex;
    gap: 6px;
  }
  .win-btn {
    width: 34px;
    height: 28px;
    border: none;
    border-radius: 5px;
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  .win-btn:hover { background: rgba(255, 255, 255, 0.18); }
  .win-btn.close:hover { background: #e81123; }
  .win-body {
    flex: 1;
    padding: 18px;
    overflow: auto;
    font-size: 15px;
  }
  .pill-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 12px 0 18px;
  }
  .btn-ui {
    padding: 9px 15px;
    border-radius: 7px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  .btn-ui:hover { background: rgba(255, 255, 255, 0.2); }
  .btn-ui.active {
    background: #0078d4;
    border-color: #4cc2ff;
  }
  #paint-canvas {
    background: #ffffff;
    border-radius: 6px;
    display: block;
    cursor: crosshair;
    max-width: 100%;
  }
  #start-menu {
    position: absolute;
    left: 16px;
    bottom: 76px;
    width: 440px;
    background: rgba(18, 22, 32, 0.96);
    backdrop-filter: blur(22px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    border-radius: 12px;
    padding: 18px;
    z-index: 40;
    display: none;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
  }
  #start-menu.open { display: block; }
  .start-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
  }
  .start-item:hover { background: rgba(255, 255, 255, 0.12); }
  #taskbar {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 68px;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: transparent;
    overflow: hidden;
  }
  #taskbar::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #ff2a85, #ff8a00, #ffd500, #00e676, #00b0ff, #7c4dff, #ff2a85);
    background-size: 300% 100%;
    opacity: 0.42;
    animation: rgbFlow 8s linear infinite;
    pointer-events: none;
    z-index: 0;
  }
  #taskbar::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: 0;
    height: 3px;
    background: linear-gradient(90deg, #ff2a85, #ff8a00, #ffd500, #00e676, #00b0ff, #7c4dff, #ff2a85);
    background-size: 300% 100%;
    animation: rgbFlow 5s linear infinite;
    pointer-events: none;
    z-index: 1;
  }
  @keyframes rgbFlow {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }
  .tb-left, .tb-right {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .tb-btn {
    height: 46px;
    padding: 0 14px;
    border-radius: 8px;
    border: none;
    background: rgba(12, 15, 24, 0.35);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
  }
  .tb-btn:hover { background: rgba(255, 255, 255, 0.18); }
  #clock {
    padding: 6px 12px;
    border-radius: 8px;
    background: rgba(12, 15, 24, 0.4);
    text-align: right;
    font-size: 13px;
    line-height: 1.25;
    text-shadow: 0 2px 6px rgba(0, 0, 0, 0.95);
  }
</style>
</head>
<body>
<div id="viewport">
  <div id="stage">
    <canvas id="wallpaper" width="1920" height="1350"></canvas>

    <div id="desktop-icons">
      <div class="desk-icon" data-app="pc"><div class="glyph">💻</div><div class="label">Bu Bilgisayar</div></div>
      <div class="desk-icon" data-app="settings"><div class="glyph">⚙️</div><div class="label">Ayarlar</div></div>
      <div class="desk-icon" data-app="lively"><div class="glyph">🌧️</div><div class="label">Lively Wallpaper 4K</div></div>
      <div class="desk-icon" data-app="ttb"><div class="glyph">🌈</div><div class="label">TranslucentTB</div></div>
      <div class="desk-icon" data-app="paint"><div class="glyph">🎨</div><div class="label">Paint</div></div>
      <div class="desk-icon" data-app="note"><div class="glyph">📝</div><div class="label">Not Defteri</div></div>
    </div>

    <div id="windows-layer"></div>

    <div id="start-menu">
      <div style="font-weight:700;font-size:17px;margin-bottom:10px;">Windows 10 Başlat</div>
      <div class="start-item" data-app="pc">💻 Bu Bilgisayar</div>
      <div class="start-item" data-app="settings">⚙️ Ayarlar</div>
      <div class="start-item" data-app="lively">🌧️ Lively Wallpaper 4K</div>
      <div class="start-item" data-app="ttb">🌈 TranslucentTB</div>
      <div class="start-item" data-app="paint">🎨 Paint</div>
      <div class="start-item" data-app="note">📝 Not Defteri</div>
    </div>

    <div id="taskbar">
      <div class="tb-left">
        <button class="tb-btn" id="btn-start">⊞ Başlat</button>
        <button class="tb-btn" data-app="pc">💻</button>
        <button class="tb-btn" data-app="settings">⚙️</button>
        <button class="tb-btn" data-app="lively">🌧️</button>
        <button class="tb-btn" data-app="ttb">🌈</button>
        <button class="tb-btn" data-app="paint">🎨</button>
      </div>
      <div class="tb-right">
        <div id="clock"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  const STAGE_W = 1920;
  const STAGE_H = 1350;
  let currentScale = 1;
  let wallpaperMode = "car";
  let ttbMode = "rgb-clear";
  let zCounter = 20;

  function fitStage() {
    try {
      const vw = window.innerWidth || STAGE_W;
      const vh = window.innerHeight || STAGE_H;
      currentScale = Math.min(vw / STAGE_W, vh / STAGE_H);
      const stage = document.getElementById("stage");
      stage.style.transform = `scale(${currentScale})`;
    } catch (e) {}
  }

  function updateClock() {
    try {
      const now = new Date();
      const timeStr = now.toLocaleTimeString("tr-TR", { hour: "2-digit", minute: "2-digit" });
      const dateStr = now.toLocaleDateString("tr-TR");
      document.getElementById("clock").innerHTML = `<div>${timeStr}</div><div>${dateStr}</div>`;
    } catch (e) {}
  }

  function applyTTB(mode) {
    ttbMode = mode;
    const tb = document.getElementById("taskbar");
    if (!tb) return;
    if (mode === "clear") {
      tb.style.setProperty("--rgb-op", "0");
      tb.innerHTML = tb.innerHTML;
    }
    const styleTag = document.getElementById("ttb-dynamic-style") || (() => {
      const s = document.createElement("style");
      s.id = "ttb-dynamic-style";
      document.head.appendChild(s);
      return s;
    })();
    if (mode === "clear") {
      styleTag.textContent = `#taskbar::before, #taskbar::after { opacity: 0 !important; }`;
    } else if (mode === "full-rgb") {
      styleTag.textContent = `#taskbar::before { opacity: 0.85 !important; } #taskbar::after { height: 5px !important; opacity: 1 !important; }`;
    } else if (mode === "dark") {
      styleTag.textContent = `#taskbar::before { opacity: 0.08 !important; } #taskbar::after { opacity: 0.25 !important; } #taskbar { background: rgba(15, 18, 26, 0.85) !important; }`;
    } else {
      styleTag.textContent = `#taskbar::before { opacity: 0.42 !important; } #taskbar::after { height: 3px !important; opacity: 1 !important; } #taskbar { background: transparent !important; }`;
    }
  }

  const canvas = document.getElementById("wallpaper");
  const ctx = canvas.getContext("2d");
  const drops = Array.from({ length: 160 }, () => ({
    x: Math.random() * STAGE_W,
    y: Math.random() * STAGE_H,
    len: 14 + Math.random() * 24,
    speed: 14 + Math.random() * 14,
    wind: -3 - Math.random() * 2
  }));

  function renderWallpaper(t) {
    try {
      ctx.clearRect(0, 0, STAGE_W, STAGE_H);
      if (wallpaperMode === "car") {
        const sky = ctx.createLinearGradient(0, 0, 0, STAGE_H);
        sky.addColorStop(0, "#050914");
        sky.addColorStop(0.55, "#0d1b36");
        sky.addColorStop(1, "#070a12");
        ctx.fillStyle = sky;
        ctx.fillRect(0, 0, STAGE_W, STAGE_H);

        // Uzak şehir ışıkları
        for (let i = 0; i < 42; i++) {
          const bx = i * 48;
          const bh = 90 + ((i * 37) % 150);
          ctx.fillStyle = "rgba(16, 24, 42, 0.85)";
          ctx.fillRect(bx, 680 - bh, 42, bh);
          ctx.fillStyle = i % 3 === 0 ? "rgba(80, 190, 255, 0.35)" : "rgba(255, 190, 90, 0.25)";
          ctx.fillRect(bx + 10, 700 - bh + 20, 6, 10);
        }

        // Islak asfalt ve neon yansımalar
        ctx.fillStyle = "#090d16";
        ctx.fillRect(0, 680, STAGE_W, STAGE_H - 680);

        const glowL = ctx.createRadialGradient(740, 880, 20, 740, 880, 420);
        glowL.addColorStop(0, "rgba(180, 235, 255, 0.45)");
        glowL.addColorStop(1, "rgba(0, 120, 255, 0)");
        ctx.fillStyle = glowL;
        ctx.fillRect(300, 680, 1320, 560);

        // Gece arabası silüeti
        ctx.fillStyle = "#0e1320";
        ctx.beginPath();
        ctx.moveTo(560, 890);
        ctx.lineTo(710, 770);
        ctx.lineTo(1190, 770);
        ctx.lineTo(1360, 890);
        ctx.lineTo(1410, 960);
        ctx.lineTo(510, 960);
        ctx.closePath();
        ctx.fill();

        // Farlar
        ctx.fillStyle = "#dff6ff";
        ctx.fillRect(600, 885, 110, 24);
        ctx.fillRect(1210, 885, 110, 24);
      } else {
        const mtn = ctx.createLinearGradient(0, 0, 0, STAGE_H);
        mtn.addColorStop(0, "#0b1726");
        mtn.addColorStop(0.6, "#1b334d");
        mtn.addColorStop(1, "#101d2b");
        ctx.fillStyle = mtn;
        ctx.fillRect(0, 0, STAGE_W, STAGE_H);

        ctx.fillStyle = "#14263a";
        ctx.beginPath();
        ctx.moveTo(0, 920);
        ctx.lineTo(420, 460);
        ctx.lineTo(860, 820);
        ctx.lineTo(1340, 410);
        ctx.lineTo(1920, 880);
        ctx.lineTo(1920, 1350);
        ctx.lineTo(0, 1350);
        ctx.closePath();
        ctx.fill();

        // Hareketli sis
        const fogX = Math.sin(t * 0.0005) * 140;
        const fog = ctx.createLinearGradient(fogX, 620, fogX + STAGE_W, 860);
        fog.addColorStop(0, "rgba(210, 230, 245, 0.04)");
        fog.addColorStop(0.5, "rgba(210, 230, 245, 0.16)");
        fog.addColorStop(1, "rgba(210, 230, 245, 0.04)");
        ctx.fillStyle = fog;
        ctx.fillRect(0, 580, STAGE_W, 340);
      }

      // Yağmur damlaları
      ctx.strokeStyle = "rgba(180, 220, 255, 0.42)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (const d of drops) {
        d.x += d.wind;
        d.y += d.speed;
        if (d.y > STAGE_H) { d.y = -20; d.x = Math.random() * STAGE_W; }
        if (d.x < 0) d.x = STAGE_W;
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x + d.wind * 1.4, d.y + d.len);
      }
      ctx.stroke();
    } catch (e) {}
    requestAnimationFrame(renderWallpaper);
  }

  function openApp(appId) {
    document.getElementById("start-menu").classList.remove("open");
    const existing = document.getElementById("win-" + appId);
    if (existing) {
      existing.style.display = "flex";
      existing.style.zIndex = ++zCounter;
      return;
    }

    const win = document.createElement("div");
    win.className = "win";
    win.id = "win-" + appId;
    win.style.left = (180 + ((zCounter - 20) * 32) % 420) + "px";
    win.style.top = (110 + ((zCounter - 20) * 28) % 260) + "px";
    win.style.width = "760px";
    win.style.height = "520px";
    win.style.zIndex = ++zCounter;

    let title = "Uygulama";
    let body = "";

    if (appId === "lively") {
      title = "🌧️ Lively Wallpaper 4K";
      body = `
        <p>Canlı duvar kağıdı sahnesini seç (1920×1350):</p>
        <div class="pill-row">
          <button class="btn-ui ${wallpaperMode === "car" ? "active" : ""}" id="wp-car">🚗 4K Gece Arabası & Yağmur</button>
          <button class="btn-ui ${wallpaperMode === "mtn" ? "active" : ""}" id="wp-mtn">⛰️ Yağmurlu Dağlar & Sis</button>
        </div>
      `;
    } else if (appId === "ttb") {
      title = "🌈 TranslucentTB";
      body = `
        <p>Görev çubuğu görünümünü ayarla:</p>
        <div class="pill-row">
          <button class="btn-ui ${ttbMode === "rgb-clear" ? "active" : ""}" id="ttb-rgb-clear">🌈 Şeffaf + RGB</button>
          <button class="btn-ui ${ttbMode === "full-rgb" ? "active" : ""}" id="ttb-full-rgb">✨ Tam RGB</button>
          <button class="btn-ui ${ttbMode === "clear" ? "active" : ""}" id="ttb-clear">💧 %100 Şeffaf</button>
          <button class="btn-ui ${ttbMode === "dark" ? "active" : ""}" id="ttb-dark">🌑 Koyu</button>
        </div>
      `;
    } else if (appId === "settings") {
      title = "⚙️ Windows Ayarları";
      body = `
        <h3>Sistem ve Ekran</h3>
        <p>Sanal Sahne Ölçeği: <b>1920 × 1350</b></p>
        <p>Durum: <b>Windows 10 Etkin</b></p>
        <div class="pill-row">
          <button class="btn-ui" onclick="document.querySelector('[data-app=lively]').click()">Duvar Kağıdına Git</button>
          <button class="btn-ui" onclick="document.querySelector('[data-app=ttb]').click()">Görev Çubuğu Ayarları</button>
        </div>
      `;
    } else if (appId === "paint") {
      title = "🎨 Paint";
      body = `
        <div class="pill-row">
          <input type="color" id="paint-color" value="#ff2a85" />
          <button class="btn-ui" id="paint-clear">Temizle</button>
        </div>
        <canvas id="paint-canvas" width="680" height="340"></canvas>
      `;
    } else if (appId === "note") {
      title = "📝 Not Defteri";
      body = `<textarea style="width:100%;height:380px;background:#0e121b;color:#fff;border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:12px;font-size:15px;" placeholder="Notlarını buraya yaz..."></textarea>`;
    } else {
      title = "💻 Bu Bilgisayar";
      body = `
        <p><b>Yerel Disk (C:)</b> — 512 GB NVMe SSD (214 GB boş)</p>
        <p><b>Çözünürlük:</b> 1920 × 1350</p>
        <p><b>WebView Modu:</b> Aktif</p>
      `;
    }

    win.innerHTML = `
      <div class="win-header">
        <div class="win-title">${title}</div>
        <div class="win-controls">
          <button class="win-btn min">─</button>
          <button class="win-btn close">✕</button>
        </div>
      </div>
      <div class="win-body">${body}</div>
    `;

    document.getElementById("windows-layer").appendChild(win);

    win.addEventListener("mousedown", () => { win.style.zIndex = ++zCounter; });
    win.querySelector(".close").addEventListener("click", () => win.remove());
    win.querySelector(".min").addEventListener("click", () => { win.style.display = "none"; });

    const header = win.querySelector(".win-header");
    let dragging = false, startX = 0, startY = 0, origX = 0, origY = 0;
    header.addEventListener("mousedown", (e) => {
      if (e.target.closest(".win-btn")) return;
      dragging = true;
      startX = e.clientX;
      startY = e.clientY;
      origX = parseFloat(win.style.left) || 0;
      origY = parseFloat(win.style.top) || 0;
      win.style.zIndex = ++zCounter;
    });
    window.addEventListener("mousemove", (e) => {
      if (!dragging) return;
      const dx = (e.clientX - startX) / currentScale;
      const dy = (e.clientY - startY) / currentScale;
      win.style.left = Math.max(0, Math.min(STAGE_W - 240, origX + dx)) + "px";
      win.style.top = Math.max(0, Math.min(STAGE_H - 120, origY + dy)) + "px";
    });
    window.addEventListener("mouseup", () => { dragging = false; });

    if (appId === "lively") {
      win.querySelector("#wp-car").onclick = () => { wallpaperMode = "car"; openApp("lively"); };
      win.querySelector("#wp-mtn").onclick = () => { wallpaperMode = "mtn"; openApp("lively"); };
    } else if (appId === "ttb") {
      win.querySelector("#ttb-rgb-clear").onclick = () => applyTTB("rgb-clear");
      win.querySelector("#ttb-full-rgb").onclick = () => applyTTB("full-rgb");
      win.querySelector("#ttb-clear").onclick = () => applyTTB("clear");
      win.querySelector("#ttb-dark").onclick = () => applyTTB("dark");
    } else if (appId === "paint") {
      const pc = win.querySelector("#paint-canvas");
      const pctx = pc.getContext("2d");
      pctx.fillStyle = "#ffffff";
      pctx.fillRect(0, 0, pc.width, pc.height);
      let drawing = false;
      pc.addEventListener("mousedown", (e) => {
        drawing = true;
        const r = pc.getBoundingClientRect();
        pctx.beginPath();
        pctx.moveTo((e.clientX - r.left) * (pc.width / r.width), (e.clientY - r.top) * (pc.height / r.height));
      });
      pc.addEventListener("mousemove", (e) => {
        if (!drawing) return;
        const r = pc.getBoundingClientRect();
        pctx.strokeStyle = win.querySelector("#paint-color").value;
        pctx.lineWidth = 4;
        pctx.lineCap = "round";
        pctx.lineTo((e.clientX - r.left) * (pc.width / r.width), (e.clientY - r.top) * (pc.height / r.height));
        pctx.stroke();
      });
      window.addEventListener("mouseup", () => { drawing = false; });
      win.querySelector("#paint-clear").onclick = () => {
        pctx.fillStyle = "#ffffff";
        pctx.fillRect(0, 0, pc.width, pc.height);
      };
    }
  }

  document.querySelectorAll("[data-app]").forEach((el) => {
    el.addEventListener("click", () => {
      const app = el.getAttribute("data-app");
      if (app) openApp(app);
    });
  });

  document.getElementById("btn-start").addEventListener("click", (e) => {
    e.stopPropagation();
    document.getElementById("start-menu").classList.toggle("open");
  });

  document.addEventListener("click", (e) => {
    if (!e.target.closest("#start-menu") && !e.target.closest("#btn-start")) {
      document.getElementById("start-menu").classList.remove("open");
    }
  });

  window.addEventListener("resize", fitStage);
  fitStage();
  updateClock();
  setInterval(updateClock, 15000);
  applyTTB("rgb-clear");
  requestAnimationFrame(renderWallpaper);
})();
</script>
</body>
</html>
